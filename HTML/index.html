<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑地平线：原体觉醒</title>
    <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>
    <div id="app"></div>
    <noscript>
        <div style="color:#ff4455;padding:50px;background:#000;height:100vh;font-family:monospace;text-align:center;">
            <h2>黑地平线：原体觉醒</h2>
            <p>请启用 JavaScript 以启动内核。</p>
        </div>
    </noscript>

    <!-- 刚性加载顺序：数据 -> 模板引擎 -> 状态机 -> 世界逻辑 -> 战斗引擎 -> 表现层 -->
    <script src="../Scripts/Data.js"></script>
    <script src="../Scripts/Config.js"></script>
    <script src="../Scripts/Strings.js"></script>
    <script src="../Scripts/TemplateEngine.js"></script>
    <script src="../Scripts/Audio.js"></script>
    <script src="../Scripts/Core.js"></script>
    <script src="../Scripts/World.js"></script>
    <script src="../Scripts/Combat.js"></script>
    <script src="../Scripts/UI.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            try {
                GameState.init();
                UISystem.init();
                UISystem.render();
            } catch (e) {
                console.error("初始化序列崩溃:", e);
                document.body.innerHTML = '<div style="color:#ff4455;padding:50px;background:#000;height:100vh;font-family:monospace;">' +
                    '<h2>[致命故障] 内核初始化失败</h2>' +
                    '<p>错误定位: ' + e.message + '</p>' +
                    '<button onclick="(function(){var k=[];for(var i=0;i<localStorage.length;i++){var key=localStorage.key(i);if(key.indexOf(\'blackHorizon_\')===0)k.push(key);}k.forEach(function(k2){localStorage.removeItem(k2);});location.reload();})();" style="background:#422;color:#f44;border:1px solid #f44;padding:10px;cursor:pointer;font-weight:bold;">清除序列残骸并重启</button>' +
                    '</div>';
            }
        });
    </script>
</body>
</html>
